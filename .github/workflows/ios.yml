name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter assets and App.framework
        run: flutter build ios --release --no-codesign || echo "Ignoring Flutter CLI signing error..."
        continue-on-error: true

      - name: Force Pods iOS Deployment Target
        run: |
          cd ios
          find Pods -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' {} + || true

      - name: Manual Xcode Build
        run: |
          cd ios
          echo "Starting xcodebuild..."
          xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" > xcodebuild.log 2>&1 || true
          echo "xcodebuild finished. Extracting errors:"
          grep -A 2 -B 2 -i "error:" xcodebuild.log || echo "No errors found in log."
          if grep -q -i "error:" xcodebuild.log; then exit 1; fi

      - name: Compress Payload to IPA
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | grep "Release-iphoneos" | head -n 1)
          echo "Found Runner.app at $APP_PATH"
          if [ ! -f "$APP_PATH/Runner" ]; then
            echo "Executable missing!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr noemiassistant.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoemiAssistant-IPA
          path: noemiassistant.ipa
