name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS App
        run: flutter build ios --release --no-codesign || echo "Ignoring Flutter CLI signing error..."

      - name: Compress Payload to IPA
        run: |
          echo "Checking if Runner.app was built..."
          ls -la build/ios/iphoneos/ || echo "iphoneos dir not found"
          
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Runner.app not found! Attempting manual xcodebuild..."
            cd ios
            xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" || true
            cd ..
          fi
          
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qr noemiassistant.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoemiAssistant-IPA
          path: build/ios/iphoneos/noemiassistant.ipa
