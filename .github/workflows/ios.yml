name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS App
        run: flutter build ios --release --no-codesign
        continue-on-error: true

      - name: Compress Payload to IPA
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found in build directory!"
            exit 1
          fi
          echo "Found Runner.app at $APP_PATH"
          mkdir -p Payload
          mv "$APP_PATH" Payload/
          zip -qr noemiassistant.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoemiAssistant-IPA
          path: noemiassistant.ipa
