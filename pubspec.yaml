name: noemiassistant
description: "Noemi AI Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI and effects
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  # For audio reactive animations / lip sync later
  # For AI integrations (Gemini)
  google_generative_ai: ^0.4.3
  # For Google Sign in
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.1
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
